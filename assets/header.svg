    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset=".55" stop-color="#0f2027"/><stop offset="1" stop-color="#173845"/>
    </linearGradient>
    <radialGradient id="orb1"><stop offset="0" stop-color="#2c9ab7" stop-opacity=".35"/><stop offset="1" stop-color="#2c9ab7" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2"><stop offset="0" stop-color="#7c5cff" stop-opacity=".22"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".06"/></pattern>
    <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#2c9ab7" stop-opacity="0"/><stop offset=".5" stop-color="#6cc4dc"/><stop offset="1" stop-color="#2c9ab7" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .edge { stroke: #6cc4dc; stroke-opacity: .28; stroke-width: 1.2; stroke-dasharray: 4 8; animation: flow 4s linear infinite; }
    .node { fill: #6cc4dc; animation: pulse 3s ease-in-out infinite; }
    .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
    .scr, .fin { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; font-size: 72px; font-weight: 700; text-anchor: middle; }
    .scr { fill: #6cc4dc; opacity: 0; animation: flash .11s linear 1; }
    .fin { fill: #f0f6fc; opacity: 0; animation: settle .5s ease-out forwards; }
    .cursor { fill: #6cc4dc; opacity: 0; animation: blink 1s step-end 1.96s infinite; }
    .sub { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; font-size: 20px; letter-spacing: 6px; fill: #9fb3c0; text-anchor: middle; opacity: 0;
            animation: rise .9s ease-out 2.16s forwards; }
    .rule { transform-origin: 640.0px 0; transform: scaleX(0); animation: grow 1.1s ease-out 2.06s forwards; }
    @keyframes flow { to { stroke-dashoffset: -48; } }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
    @keyframes drift1 { to { transform: translate(160px, 40px); } }
    @keyframes drift2 { to { transform: translate(-200px, -30px); } }
    @keyframes flash { from, to { opacity: .85; } }
    @keyframes settle { from { opacity: 0; fill: #6cc4dc; } 40% { opacity: 1; } to { opacity: 1; fill: #f0f6fc; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
