name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2c9ab7&color_dots=#ebedf0,#b6e3f0,#6cc4dc,#2c9ab7,#1b5e75
            dist/snake-dark.svg?palette=github-dark&color_snake=#6cc4dc&color_dots=#161b22,#0e3a47,#145a6e,#2c9ab7,#6cc4dc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
